services:
  - type: web
    name: doce-encontro
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    disk:
      name: doce-encontro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: PIX_KEY
        sync: false
      - key: PIX_RECEIVER_NAME
        value: C. Yasmin
      - key: PIX_CITY
        value: Petrolina
