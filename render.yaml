services:
  - type: web
    name: doce-encontro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/doce-encontro
      - key: ADMIN_PASSWORD
        sync: false
      - key: PIX_KEY
        sync: false
      - key: PIX_RECEIVER_NAME
        value: C. Yasmin
      - key: PIX_CITY
        value: Petrolina
